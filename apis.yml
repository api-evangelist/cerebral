aid: cerebral
name: Cerebral
description: 'Cerebral is an American telehealth company providing online mental health
  and wellness care, including therapy, counseling, psychiatric evaluations, and medication
  management delivered through its website and mobile app on a subscription basis. Founded
  in 2020 by Kyle Robertson and Ho Anh, the company treats conditions such as depression,
  anxiety, insomnia, ADHD, and substance use disorder. Cerebral is backed by SoftBank
  Vision Fund 2, which led a $300M Series C in December 2021 valuing the company at
  roughly $4.8B. Cerebral is a direct-to-consumer product and does not publish a public
  developer API or programmatic surface; this API Evangelist profile tracks its public
  company and website properties.'
